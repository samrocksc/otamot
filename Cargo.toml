[package]
name = "otamot"
version = "0.12.0"
edition = "2021"
authors = ["samrocksc"]
description = "A cross-platform Pomodoro timer with notes support"
license = "MIT"
repository = "https://github.com/samrocksc/otamot"

[lib]
name = "otamot"
path = "src/lib.rs"

[[bin]]
name = "otamot"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.29"
image = "0.25"  # For loading icon images
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
pulldown-cmark = "0.9"
anyhow = "1.0"
notify-rust = "4"
tray-icon = "0.19"
tao = "0.30"
rodio = { version = "0.20", default-features = false, features = [
    "symphonia-all",
] }
cpal = "0.15"
whisper-rs = "0.16"

reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }

[features]
# Linux system-audio capture via PulseAudio/PipeWire sink monitors
pulse-capture = ["dep:libpulse-simple-binding", "dep:libpulse-binding"]

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = { version = "2", optional = true }
libpulse-simple-binding = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.9"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSUUID", "NSObject", "NSValue"] }
objc2-core-audio = { version = "0.3", features = ["objc2", "objc2-core-audio-types", "block2", "dispatch2"] }
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
